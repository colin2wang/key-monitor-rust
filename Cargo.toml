[package]
name = "key-monitor-rust"
version = "0.1.2"
edition = "2021"

[dependencies]
egui = "0.30.0"
eframe = "0.30.0"
log = "0.4.25"
env_logger = "0.11.6"
chrono = "0.4"
winapi = { version = "0.3.9", features = ["winuser"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"